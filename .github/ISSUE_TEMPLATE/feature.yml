name: 💡 Feature request
description: Suggest a feature for the platform, MCP server, or registry tooling.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What are you trying to do that is hard or impossible today? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
