name: Release content

# Triggers:
#   - Push a tag like `content-v1.2.0` to publish a GitHub Release with
#     per-category zip bundles + a generated changelog.
#   - Manually via "Run workflow" (uses the input version, doesn't push a tag).
on:
  push:
    tags:
      - "content-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. content-v1.2.0)"
        required: true
        type: string

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release version
        id: ver
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$REQUESTED_VERSION"
          fi
          [[ "$VERSION" =~ ^content-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid content release version"; exit 2; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Validate content
        run: bun run validate:content

      - name: Build release bundles
        run: node --experimental-strip-types scripts/build-release-bundles.ts --version "${{ steps.ver.outputs.version }}"

      - name: Generate changelog
        run: |
          node --experimental-strip-types scripts/generate-changelog.ts \
            --version "${{ steps.ver.outputs.version }}" \
            --out dist/release/CHANGELOG.md

      - name: Build standalone offline verifier
        run: |
          node scripts/build-release-verifier.mjs
          cp security/content-signing-keys.json dist/release/SIGNING_KEYS.json

      - name: Sign and verify release artifacts
        env:
          SIGNING_PRIVATE_KEY: ${{ secrets.CONTENT_SIGNING_PRIVATE_KEY }}
          SIGNING_PUBLIC_KEY: ${{ secrets.CONTENT_SIGNING_PUBLIC_KEY }}
        run: |
          node --experimental-strip-types scripts/sign-release-bundle.ts --dir dist/release --keyring security/content-signing-keys.json
          node --experimental-strip-types scripts/verify-release-bundle.ts --dir dist/release --keyring security/content-signing-keys.json

      - name: Show release manifest
        run: cat dist/release/manifest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: dist/release/CHANGELOG.md
          fail_on_unmatched_files: true
          files: |
            dist/release/super-agent-skill-content-*.zip
            dist/release/skills-*.zip
            dist/release/playbooks-*.zip
            dist/release/souls-*.zip
            dist/release/guardrails-*.zip
            dist/release/manifest.json
            dist/release/CHANGELOG.md
            dist/release/*.sig
            dist/release/SIGNATURES.json
            dist/release/SIGNING_PUBLIC_KEY.pem
            dist/release/verify-release-bundle.mjs
            dist/release/SIGNING_KEYS.json
