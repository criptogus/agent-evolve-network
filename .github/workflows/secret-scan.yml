name: Secret scan

# BLOCKING secret scanning with Gitleaks. A project that builds trust tooling
# must not rely on humans noticing an accidental key commit; this makes it a
# failed CI run instead.
#
# - `pull_request`: scans the changes being proposed.
# - `push` / weekly cron: scans the FULL history — catches secrets that landed
#   on main before this gate existed.
#
# If something trips here: rotate the secret immediately (it is already burned
# — scanning does not un-leak it), then purge it from history.
#
# To customize rules or add allowlists (e.g. obvious test fixtures), add a
# `.gitleaks.toml` at the repo root — Gitleaks picks it up automatically.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full-history catch-up scan.
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so push/cron runs cover pre-gate history, not just HEAD.
          fetch-depth: 0

      - name: Gitleaks
        # Pinned to the exact commit of gitleaks-action v2.3.9 — same pinning
        # policy as NVIDIA SkillSpector in skillspector.yml. Bump deliberately.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Signing keyring hygiene
        # BLOCKING: both rings must parse, fingerprint-match and have exactly
        # one active key. An empty ring made "verified by SuperAgentSkill"
        # forgeable (any public key passed verification); see docs/SIGNING-KEYS.md.
        run: node --experimental-strip-types scripts/check-signing-keyrings.ts
