name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate tests, types, build, lint and generated artifacts
        run: npm run check:project
      - name: Upload validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-receipts
          path: artifacts/validation/
