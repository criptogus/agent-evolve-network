slug: my-playbook
name: My Playbook
type: playbook
version: 0.1.0
description: One-sentence summary of the workflow this playbook automates.
trigger: When the user asks to <X> with input that looks like <Y>.
inputs:
  topic: { type: string }
outputs:
  report: { type: string }
steps:
  - id: research
    action: skill:web-research
    with: { query: "${inputs.topic}" }
  - id: draft
    action: skill:long-form-writer
    with: { brief: "${steps.research.output}" }
    on_error: retry
  - id: review
    action: skill:code-reviewer   # any skill slug from the registry
    when: "${inputs.topic contains 'code'}"
guardrails: [no-pii-in-output]
tags: [example]
license: CC-BY-SA-4.0
authors: ["your-handle <you@example.com>"]
