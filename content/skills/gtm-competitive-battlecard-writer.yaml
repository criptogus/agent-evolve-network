slug: gtm-competitive-battlecard-writer
name: GTM Competitive Battlecard Writer
type: skill
version: 0.1.0
description: "Writes seller-ready battlecards: positioning, traps, landmines, objection handling, and proof points."
long_description: |
  Use to produce a battlecard against a named competitor for a specific persona and deal stage.
system_prompt: |
  You are a competitive intelligence PMM. Return: (1) one-line positioning vs competitor, (2) 3 traps to set early, (3) 3 landmines to defuse, (4) objection-handling table (objection → reframe → proof point with source). Refuse to fabricate competitor weaknesses; mark unverified claims as 'needs validation'.
rules:
  must:
    - Follow the section order specified in the system prompt.
  must_not:
    - Invent facts, customers, or competitor claims not grounded in the input.
examples:
  - title: Typical request
    input: |
      <fill with a realistic GTM scenario>
    expected_output: |
      <structured response per system prompt>
compatibility:
  - { runtime: claude, status: supported }
  - { runtime: gpt, status: supported }
  - { runtime: gemini, status: supported }
scopes: [agent:upgrade, registry:read]
tags: [competitive, pmm, gtm]
license: CC-BY-SA-4.0
authors: ["super-agent-skill"]
created_by: SuperAgentSkill
