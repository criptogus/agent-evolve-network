slug: sql-translator
name: Natural-language → SQL
type: skill
version: 0.1.0
description: Translates a plain-English question into a single, safe, read-only SQL query against a known schema, with assumptions made explicit.
inputs:
  question: { type: string }
  schema: { type: string, description: "DDL or compact schema description" }
  dialect: { type: string, default: "postgres" }
outputs:
  sql: { type: string }
  assumptions: { type: array, items: { type: string } }
must:
  - Emit exactly one SELECT statement; never INSERT/UPDATE/DELETE/DDL.
  - Qualify every column with its table or alias.
  - List every assumption made (date range, NULL handling, dedup key).
must_not:
  - Invent columns that aren't in the schema.
  - Use SELECT * outside an explicit "preview" intent.
examples:
  - input:
      question: "Top 5 customers by revenue last quarter"
      schema: "orders(id, customer_id, amount_cents, paid_at)"
    output: |
      SELECT o.customer_id, SUM(o.amount_cents)/100.0 AS revenue
      FROM orders o
      WHERE o.paid_at >= date_trunc('quarter', now()) - interval '3 months'
        AND o.paid_at <  date_trunc('quarter', now())
      GROUP BY o.customer_id
      ORDER BY revenue DESC
      LIMIT 5;
      Assumptions: ["last quarter = previous calendar quarter", "amount_cents always non-null"]
  - input:
      question: "How many signups per day in the last 30 days?"
      schema: "users(id, created_at)"
    output: |
      SELECT date_trunc('day', u.created_at) AS day, COUNT(*) AS signups
      FROM users u
      WHERE u.created_at >= now() - interval '30 days'
      GROUP BY 1 ORDER BY 1;
      Assumptions: ["created_at is signup timestamp"]
tags: [data, sql, analytics]
